<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - CETI Job De Macedo Brito</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .error-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            border-top: 6px solid #e53e3e;
        }

        .error-icon {
            font-size: 50px;
            color: #e53e3e;
            margin-bottom: 20px;
        }

        .error-card h2 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .error-card p {
            color: #718096;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-voltar {
            display: inline-block;
            background-color: #1b4332;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-icon">
            <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2>Acesso Restrito ao Corpo Docente</h2>
        <p>Esta área é exclusiva para professores e coordenação pedagógica. Seu perfil de estudante não possui permissão de acesso.</p>
        <a href="index.html" class="btn-voltar"><i class="fa-solid fa-house"></i> Voltar ao Início</a>
    </div>

</body>
</html>
